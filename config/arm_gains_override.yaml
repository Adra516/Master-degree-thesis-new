# Arm PID gain overrides for the Gazebo effort controllers.
#
# RE-TUNED 2026-07-09 with an automated measured battery (3 s hold-ripple
# peak-to-peak + 15-degree waist step ring + descent-trajectory end error,
# recorded from /locobot/joint_states) instead of eyeballing Gazebo.
#
# THE OSCILLATION CULPRIT WAS forearm_roll's p=20 — NOT the waist/wrists.
# Measured at grasp_ready hold (forearm_roll ripple peak-to-peak):
#
#   p=20 i=0 d=3   (previous)      ->  371..1660 mrad  RAILED at its 2 Nm
#   p=20 i=0 d=1                   ->  227 mrad         effort limit and
#   p=20 i=1 d=0.5 (edited vendor) ->  880 mrad         limit-cycling; the
#   p=20 i=0 d=0.5                 ->  870 mrad         chatter SHOOK the
#   p=10 i=0 d=0.5                 -> 1392 mrad         whole arm (seen as
#   p=5  i=0 d=0   (TRUE vendor)   ->    3 mrad  <- WINNER  "arm oscillates")
#
# With forearm_roll back at the true vendor p=5, wrist_rotate's ripple fell
# 120 mrad -> 0.2 mrad by itself: the wrists were being SHAKEN, not unstable.
# Full winning-set battery: hold ripple <= 3.2 mrad ALL joints, waist
# post-step ring 0.2 mrad (was 122 mrad with the d=3/d=2 wrist overrides),
# descent-trajectory end error <= 9 mrad.
#
# NOTE: the interbotix VENDOR yaml itself was edited long ago (forearm_roll
# "was p5->p20" comment there), so this override MUST pin forearm_roll back
# to p=5 — do not delete that line thinking vendor is fine.
#
# Standing findings that still hold:
#  1. NO integral term on forearm_roll: i>0 winds up against joint friction
#     into a slow limit cycle.
#  2. High D amplifies Gazebo's noisy joint-velocity estimate into a violent
#     2-4 Hz buzz (measured again this session: wrist_rotate d=2 and
#     wrist_angle d=3 both contributed ripple; vendor d is correct there).
#  3. Waist keeps vendor i=5 (dropping it BACKFIRED: yaw axis has ~no gravity
#     torque, so i is not wind-up there); waist d=3 measured marginally
#     quieter than d=1 on the step test (2.9 vs 4.6 mrad ring).
#
# Loaded (no namespace) LAST in locobot.launch. roslaunch uploads all params
# before starting any node, so this wins over the vendor values before the
# controller_spawner reads the gains.
locobot:
  arm_controller:
    gains:
      forearm_roll: {p: 5.0,   i: 0.0, d: 0.0}    # TRUE vendor; see table above
      waist:        {p: 100.0, i: 5.0, d: 3.0}    # vendor + d 1->3 (measured)
      wrist_angle:  {p: 100.0, i: 3.0, d: 1.0}    # vendor (d=3 was ripple source)
      wrist_rotate: {p: 100.0, i: 1.0, d: 0.1}    # vendor (d=2 was ripple source)
  # Gripper LEFT AT VENDOR GENTLE GAINS (p=100) on purpose.  The gazebo_grasp_fix
  # WELD is the holder (it fires on the two-sided contact and rigidly attaches
  # the object), so the fingers only need to make gentle contact.  A stronger
  # clamp (p=300) was tried and actively HURT: at the ~6 mm the fingers travel
  # past the measured surface (YOLO over-estimates the bottle width), p=300 threw
  # the bottle sideways when the first finger landed before the second — pushing
  # it away instead of letting it self-centre — and the buried fingers vibrated,
  # oscillating the arm.  p=100 nudges gently → object self-centres → weld fires.
  # (No gripper_controller override here = vendor p=100 d=1 i=0 stays in effect.)
