# Object catalogue: which detector labels can be the object the user names.
#
# Replaces the hardcoded _ALIAS_MAP in yolo_detection_node.py
#
#   names        what a user (or the VLM) may call it; matched case-insensitively,
#                spaces/underscores ignored. The key itself always counts.
#   yolo_labels  COCO labels the detector has been MEASURED to report for it in
#                this world (see yolo_class_probe.py and this project's memory).
#                Only measured labels belong here: a guessed label silently
#                steals detections from whatever else carries it.
#   size         real size, metres: x = depth, y = width, z = height. Used only
#                to break ties when several detections could be the target
#                (CatalogResolver.plausibility) — this is the piece that
#                _ALIAS_MAP could not do: when two DIFFERENT physical objects
#                get labelled the same wrong class, the one whose measured size
#                actually matches the catalogue wins instead of racing on
#                whichever frame arrived first.
#   role         "surface" = not something to pick; feeds the table model.
#   round        true = the object's cross-section is a circle (bottle, can,
#                the ball capsule): orientation is genuinely meaningless, skip
#                estimating it. Deliberately NOT inferred from the footprint
#                being square (width == length) — a square footprint and a
#                round one are different shapes. tea_box is square (45x45mm)
#                but NOT round: it has 4 real, flat faces, and grasping it at
#                the wrong yaw catches a corner instead of a face. Confirmed
#                live (2026-10-05, ground-truth pose trace): a corner-caught
#                tea_box pick toppled it 45-67 degrees in roll/pitch while
#                being lifted. Omitted/false = not round (the default).
#
# Units: metres.
#
version: 1

objects:
  bottle:
    names: [bottle, beer bottle, beer]
    yolo_labels: [bottle]
    round: true
    size: {x: 0.062, y: 0.062, z: 0.23}

  tea_box:
    names: [tea box, teabox, tea]
    yolo_labels: [tea_box]
    size: {x: 0.045, y: 0.045, z: 0.09}

  can_coke:
    names: [coke can, cancoke, coke, can, soda can]
    yolo_labels: [can_coke]
    round: true
    # Measured from the model's meshes at its 0.63 scale: 44.7 mm diameter,
    # 81.6 mm tall (not the 55 x 96 mm the model.sdf comment states).
    size: {x: 0.045, y: 0.045, z: 0.082}

  ball:
    # Reshaped into an upright capsule (models/ball_capsule) so the jaws can
    # take it from the side; the fine-tuned model was trained on frames of
    # this capsule shape directly -> not tested
    names: [ball, sports ball]
    yolo_labels: [ball]
    round: true
    size: {x: 0.045, y: 0.045, z: 0.12}

  table:
    role: surface
    names: [table, dining table]
    yolo_labels: [table]
    size: {x: 0.40, y: 0.80, z: 0.25}
